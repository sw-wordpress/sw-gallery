<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>sw-gallery masonry fixture</title>
        <!-- Needs the script: run `npx vite --open /frontend/fixtures/masonry.html` in assets (dev server transpiles masonry.ts). Without it the page is a plain grid. Review: resize (re-packs), Tab order = DOM order (links #i1, #i2, ...), dir="rtl", colour scheme. -->
        <link rel="stylesheet" href="../src/layouts.css" />
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                font-family: system-ui, sans-serif;
                margin: 1rem auto;
                max-width: 64rem;
                padding: 0 1rem;
            }
        </style>
    </head>
