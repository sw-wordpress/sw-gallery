# Throw-away WordPress + MariaDB for the release-ZIP install test (bin/test-zip-install.sh, docs/release.md).
# Unlike compose.yml no plugin directory is mounted: the wp-cli container installs the ZIP with `wp plugin install`.
# Always started through the script (generated env file, unique project name, removed afterwards). Never point this at a real install.
name: ${SWG_E2E_PROJECT:-swg-zip}

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DB_NAME: wp
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_DEBUG_LOG', true );
    define( 'DISALLOW_FILE_EDIT', true );
    define( 'DISABLE_WP_CRON', true );
    define( 'AUTOMATIC_UPDATER_DISABLED', true );
    if ( isset( $$_SERVER['HTTP_HOST'] ) ) {
        define( 'WP_HOME', 'http://' . $$_SERVER['HTTP_HOST'] );
        define( 'WP_SITEURL', WP_HOME );
    }

services:
  db:
    image: ${SWG_E2E_DB_IMAGE:-mariadb:11.4}
    environment:
      MARIADB_ROOT_PASSWORD: root-${SWG_E2E_PW_ADMIN:?}
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 40

  wordpress:
    image: ${SWG_E2E_WP_IMAGE:-wordpress:6.9-php8.3-apache}
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *wp-env
    ports:
      - "127.0.0.1:${SWG_E2E_PORT:?}:80"
    volumes:
      - wp:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php && php -r 'exit(@fsockopen(\"127.0.0.1\",80)?0:1);'"]
      interval: 2s
      timeout: 3s
      retries: 40

  # One-shot provisioning (docker compose run --rm wpcli): core install, install + activate the ZIP.
  wpcli:
    image: ${SWG_E2E_CLI_IMAGE:-wordpress:cli-php8.3}
    profiles: ["provision"]
    user: "33:33"
    depends_on:
      wordpress: { condition: service_healthy }
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      SWG_E2E_BASE_URL: ${SWG_E2E_BASE_URL:?}
      SWG_E2E_PW_ADMIN: ${SWG_E2E_PW_ADMIN:?}
    volumes:
      - wp:/var/www/html
      - type: bind
        source: ${SWG_E2E_ZIP_FILE:?set by bin/test-zip-install.sh}
        target: /zip/plugin.zip
        read_only: true
      - ./provision-zip.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]

volumes:
  wp:
