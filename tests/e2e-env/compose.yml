# Throw-away WordPress + MariaDB for the Playwright suite (see docs/development.md, "End-to-end tests").
# Always started through bin/test-e2e.sh, which generates .generated/e2e.env (ports, passwords, plugin path), uses a unique
# project name and removes containers, network and volumes afterwards. Never point this at a real install.
name: ${SWG_E2E_PROJECT:-swg-e2e}

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DB_NAME: wp
  WORDPRESS_DEBUG: "1"
  # The same files answer on two ports (build / no-build instance), so home and siteurl follow the request host.
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_DEBUG_LOG', true );
    define( 'DISALLOW_FILE_EDIT', true );
    if ( isset( $$_SERVER['HTTP_HOST'] ) ) {
        define( 'WP_HOME', 'http://' . $$_SERVER['HTTP_HOST'] );
        define( 'WP_SITEURL', WP_HOME );
    }

x-plugin-mount: &plugin-mount
  type: bind
  source: ${SWG_E2E_PLUGIN_DIR:?set by bin/test-e2e.sh}
  target: /var/www/html/wp-content/plugins/sw-gallery
  read_only: true

services:
  db:
    image: ${SWG_E2E_DB_IMAGE:-mariadb:11.4}
    environment:
      MARIADB_ROOT_PASSWORD: root-${SWG_E2E_PW_ADMIN:?}
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 40

  wordpress:
    image: ${SWG_E2E_WP_IMAGE:-wordpress:6.9-php8.3-apache}
    depends_on:
      db: { condition: service_healthy }
    environment: *wp-env
    ports:
      - "127.0.0.1:${SWG_E2E_PORT:?}:80"
    volumes:
      - wp:/var/www/html
      - *plugin-mount
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php && php -r 'exit(@fsockopen(\"127.0.0.1\",80)?0:1);'"]
      interval: 2s
      timeout: 3s
      retries: 40

  # Same WordPress files and database, but assets/admin is hidden behind an empty tmpfs: the "admin app not built" case.
  wordpress-nobuild:
    image: ${SWG_E2E_WP_IMAGE:-wordpress:6.9-php8.3-apache}
    depends_on:
      wordpress: { condition: service_healthy }
    environment: *wp-env
    ports:
      - "127.0.0.1:${SWG_E2E_PORT_NOBUILD:?}:80"
    volumes:
      - wp:/var/www/html
      - *plugin-mount
      - type: tmpfs
        target: /var/www/html/wp-content/plugins/sw-gallery/assets/admin

  # One-shot provisioning (docker compose run --rm wpcli): core install, language, plugin, role users.
  wpcli:
    image: ${SWG_E2E_CLI_IMAGE:-wordpress:cli-php8.3}
    profiles: ["provision"]
    user: "33:33"
    depends_on:
      wordpress: { condition: service_healthy }
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      SWG_E2E_BASE_URL: ${SWG_E2E_BASE_URL:?}
      SWG_E2E_PW_ADMIN: ${SWG_E2E_PW_ADMIN:?}
      SWG_E2E_PW_EDITOR: ${SWG_E2E_PW_EDITOR:?}
      SWG_E2E_PW_AUTHOR: ${SWG_E2E_PW_AUTHOR:?}
      SWG_E2E_PW_CONTRIBUTOR: ${SWG_E2E_PW_CONTRIBUTOR:?}
      SWG_E2E_PW_SUBSCRIBER: ${SWG_E2E_PW_SUBSCRIBER:?}
      SWG_E2E_PW_GERMAN: ${SWG_E2E_PW_GERMAN:?}
    volumes:
      - wp:/var/www/html
      - *plugin-mount
      - ./provision.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]

volumes:
  wp:
