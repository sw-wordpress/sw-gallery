name: Tests

# Static analysis, unit tests, the WordPress integration suites (PHP x WordPress matrix), the strict coverage gate
# (> 80 %) and the SonarQube Cloud upload. Third-party actions are pinned to full version tags.
on:
  pull_request: null

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SWG_TEST_DB_HOST: 127.0.0.1
  SWG_TEST_DB_PORT: '3306'
  SWG_TEST_DB_USER: root
  SWG_TEST_DB_PASSWORD: wordpress-test

jobs:
  static:
    name: Style, static analysis, unit tests, translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: shivammathur/setup-php@2.33.0
        with:
          php-version: '8.2'
          extensions: mbstring, zip, sodium
          tools: composer:v2
          coverage: none
      - name: Install GNU gettext (translation check)
        run: sudo apt-get update && sudo apt-get install -y gettext zsh
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Audit shipped Composer packages
        run: php bin/audit-composer-production.php
      - run: composer cs
      - run: composer cs:wp
      - run: composer stan
      - run: composer test
      - run: bin/i18n.sh check

  # Supported matrix (docs/development.md, "Supported matrix"): PHP 8.2-8.4 x WordPress 6.4 (minimum), 6.9 and the newest stable release
  # on MariaDB 11.4, plus database variants (oldest MariaDB LTS, MySQL 8.0/8.4) and WordPress trunk (experimental: may fail).
  wordpress:
    name: WordPress suite (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }}, ${{ matrix.db_name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        wp: ['6.4.*', '6.9.*', 'latest']
        db_name: ['MariaDB 11.4']
        db_image: ['mariadb:11.4']
        db_health: ['healthcheck.sh --connect --innodb_initialized']
        experimental: [false]
        include:
          - { php: '8.4', wp: 'trunk', db_name: 'MariaDB 11.4', db_image: 'mariadb:11.4', db_health: 'healthcheck.sh --connect --innodb_initialized', experimental: true }
          - { php: '8.2', wp: '6.4.*', db_name: 'MariaDB 10.11', db_image: 'mariadb:10.11', db_health: 'healthcheck.sh --connect --innodb_initialized', experimental: false }
          - { php: '8.2', wp: '6.4.*', db_name: 'MySQL 8.0', db_image: 'mysql:8.0', db_health: 'mysqladmin ping -h 127.0.0.1 -uroot -pwordpress-test', experimental: false }
          - { php: '8.3', wp: 'latest', db_name: 'MySQL 8.4', db_image: 'mysql:8.4', db_health: 'mysqladmin ping -h 127.0.0.1 -uroot -pwordpress-test', experimental: false }
    services:
      database:
        image: ${{ matrix.db_image }}
        # MariaDB and MySQL images both understand the MYSQL_* variables.
        env:
          MYSQL_ROOT_PASSWORD: wordpress-test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: swg_wp_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db_health }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: shivammathur/setup-php@2.33.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, gd, zip, sodium
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer install --working-dir=tests/wp --prefer-dist --no-interaction --no-progress
      - name: Select the WordPress version (${{ matrix.wp }})
        run: bin/wp-version.sh '${{ matrix.wp }}'
      - name: Single site
        run: composer test:wp
      # Both suites share one disposable database: keep these steps sequential.
      - name: Multisite
        run: composer test:wp:ms
      - name: MCP absence (no adapter)
        run: composer test:wp:nomcp

  coverage:
    name: PHP coverage gate (> 80 %)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wordpress-test
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: swg_wp_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: shivammathur/setup-php@2.33.0
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, gd, zip, sodium
          tools: composer:v2
          # PCOV measures the required line coverage without Xdebug's planner stress-test overhead.
          coverage: pcov
          # tests/wp runs from a subdirectory; collect the complete plugin in both suites.
          ini-values: pcov.directory=${{ github.workspace }}
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer install --working-dir=tests/wp --prefer-dist --no-interaction --no-progress
      - name: Install documented operator shells
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Unit + WordPress suite coverage, merge, strict gate
        run: |
          mkdir -p coverage
          composer test:coverage
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: php-coverage
          path: coverage/clover.xml
          if-no-files-found: error
          retention-days: 14

  sonarqube:
    name: SonarQube Cloud
    needs:
      - static
      - wordpress
      - coverage
    runs-on: ubuntu-latest
    # Secrets are not available to forks and Dependabot: the analysis then simply does not run.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: SonarQube token present?
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is not available (fork or not configured): skipping the SonarQube Cloud upload."
          fi
      - uses: actions/checkout@v4.2.2
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4.3.0
        if: env.SONAR_TOKEN != ''
        with:
          name: php-coverage
          path: coverage
      # The JavaScript coverage is measured here again (cheap) because artifacts do not cross workflow files;
      # js.yml remains the gate, this only feeds SonarQube Cloud.
      - uses: actions/setup-node@v4.4.0
        if: env.SONAR_TOKEN != ''
        with:
          node-version-file: apps/admin/.nvmrc
      - name: JavaScript coverage for SonarQube (admin app, frontend assets and block)
        if: env.SONAR_TOKEN != ''
        run: |
          (cd apps/admin && npm ci --no-audit --no-fund && npm run test:coverage)
          (cd assets && npm ci --no-audit --no-fund && npm run test:coverage)
          (cd assets/blocks && npm ci --no-audit --no-fund && npm run test:coverage)
      - name: Analyze code and import coverage
        if: env.SONAR_TOKEN != ''
        # SonarSource/sonarqube-scan-action pinned by commit (tag v5.x).
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'sw-wordpress' }}
            -Dsonar.qualitygate.wait=true
