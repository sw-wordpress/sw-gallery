name: Signed release

# Tests run only on pull requests. This protected job builds and verifies artifacts, then publishes a complete signed draft.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: plugin-releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: shivammathur/setup-php@2.33.0
        with:
          php-version: '8.2'
          extensions: zip, sodium, mbstring
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: apps/admin/.nvmrc
      - name: Validate identity and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$GITHUB_REPOSITORY" = sw-wordpress/sw-gallery ]]
          [[ "$GITHUB_REPOSITORY_ID" = 1453105629 ]]
          [[ "$RELEASE_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          bin/version.sh check
          test "$version" = "$(bin/version.sh get)"
          composer validate --strict
      - name: Embed public key (abort without signing configuration)
        env:
          SW_PLUGIN_RELEASE_SIGNING_KEY: ${{ secrets.SW_PLUGIN_RELEASE_SIGNING_KEY }}
          SW_PLUGIN_RELEASE_KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: php bin/release-manifest.php public-key packages/wordpress/src/Update/Config/trusted-keys.php
      - name: Build and validate installable ZIP
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          bin/build-zip.sh "$RUNNER_TEMP/dist"
          bin/verify-zip.sh "$RUNNER_TEMP/dist/sw-gallery-$(bin/version.sh get).zip"
      - name: Upload package to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Any existing release (even a draft) is left untouched; no clobber or overwrite.
          gh api repos/sw-wordpress/sw-gallery/releases > "$RUNNER_TEMP/releases.json"
          php -r '$r=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); foreach($r as $v) {if($v["tag_name"]===$argv[2]) {exit(1);}}' "$RUNNER_TEMP/releases.json" "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "sw-gallery ${RELEASE_TAG#v}" --notes 'Signed manual WordPress update. See CHANGELOG.md.'
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/dist/*.zip
          release_api="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api "$release_api" > "$RUNNER_TEMP/release.json"
      - name: Sign and verify the actual uploaded assets
        env:
          SW_PLUGIN_RELEASE_SIGNING_KEY: ${{ secrets.SW_PLUGIN_RELEASE_SIGNING_KEY }}
          SW_PLUGIN_RELEASE_KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: |
          php bin/release-manifest.php sign "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/dist" "$GITHUB_SHA"
          php bin/verify-signed-release.php "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/dist" packages/wordpress/src/Update/Config/trusted-keys.php
      - name: Upload signature and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/dist/sw-plugin-release.json" "$RUNNER_TEMP/dist/sw-plugin-release.json.sig"
          # Download back from the draft to verify the complete uploaded set before publication.
          mkdir "$RUNNER_TEMP/uploaded"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/uploaded"
          php bin/verify-signed-release.php "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/uploaded" packages/wordpress/src/Update/Config/trusted-keys.php
          gh release edit "$RELEASE_TAG" --draft=false
