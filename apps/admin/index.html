<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>sw-gallery admin - dev host (simulated wp-admin)</title>
        <!--
      Development host page only, NOT part of the production build. It simulates wp-admin chrome
      and a few hostile global styles so style isolation can be checked by eye, and prints the
      same bootstrap object the PHP admin page prints.
    -->
        <style>
            body {
                margin: 0;
                background: #f0f0f1;
                color: #3c434a;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                font-size: 13px;
                line-height: 1.4em;
            }
            h1,
            h2 {
                margin: 1em 0;
                color: #1d2327;
                font-weight: 400;
            }
            p {
                font-size: 13px;
                margin: 1em 0;
            }
            #wpadminbar {
                height: 32px;
                background: #1d2327;
                color: #fff;
                padding: 7px 12px;
                box-sizing: border-box;
            }
            #wpcontent {
                padding-left: 20px;
            }
        </style>
        <script>
            const params = new URLSearchParams(location.search);
            const lang = params.get('lang') === 'de' ? 'de_DE' : 'en_US';
            window.swgAdmin = {
                restRoot: location.origin + '/wp-json/swg/v1/',
                nonce: 'dev-nonce',
                locale: lang,
                version: '0.1.0-dev',
                adminUrl: location.origin + '/wp-admin/',
                capabilities: (params.get('caps') || 'swg_view').split(','),
                isRtl: params.get('rtl') === '1',
                timezone: 'Europe/Berlin',
            };
        </script>
    </head>
    <body class="wp-admin wp-core-ui">
        <div id="wpadminbar">WordPress admin bar (simulated)</div>
        <div id="wpcontent">
            <div id="swg-admin-root"></div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
